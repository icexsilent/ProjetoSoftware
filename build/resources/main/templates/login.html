<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Rede+Social</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f0f2f5;">
    <div class="container" style="max-width:400px;">
        <div class="card" style="text-align:center;">
            <div class="card-header" style="font-size:28px; padding:30px 20px;">
                <div class="logo">Rede+Social</div>
            </div>
            <div class="card-body">
                <form action="/login" method="post">
                    <input type="text" name="login" placeholder="Login (admin)" required>
                    <input type="password" name="senha" placeholder="Senha (123456)" required>
                    <button type="submit" style="margin-top:20px;">Entrar</button>
                </form>
                <div th:if="${erro}" style="color:#e74c3c; margin-top:16px; font-size:14px;">
                    <span th:text="${erro}"></span>
                </div>
                <p style="margin-top:20px; color:#666;">
                    <small>Login padrão: <strong>admin</strong> • Senha: <strong>123456</strong></small>
                </p>
            </div>
        </div>
        <p style="text-align:center; margin-top:20px;">
            <a href="/" style="color:#0095f6;">Voltar ao início</a>
        </p>
    </div>
</body>
</html>

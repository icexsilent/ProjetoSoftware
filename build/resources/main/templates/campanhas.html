<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil • Rede+Social</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div class="header"><div class="logo">Perfil</div></div>

    <div class="container">
        <div class="card" style="text-align:center; padding:30px;">
            <div style="width:100px; height:100px; background:#ddd; border-radius:50%; margin:0 auto 16px; background-image:url('https://via.placeholder.com/150'); background-size:cover;"></div>
            <h3 th:text="${usuario}">Usuário</h3>
            <p style="color:#666;">Membro desde 2025</p>
            <button class="secondary">Editar Perfil</button>
        </div>

        <div class="card">
            <div class="card-header">Minhas Contribuições</div>
            <div class="card-body">
                <p>Você ainda não fez doações.</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="/"><i data-feather="home"></i>Início</a>
        <a href="/campanhas"><i data-feather="flag"></i>Campanhas</a>
        <a href="/perfil" class="active"><i data-feather="user"></i>Perfil</a>
    </div>

    <script>feather.replace()</script>
</body>
</html>

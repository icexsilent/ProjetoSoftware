<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Campanhas - Rede Mais Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg,#f093fb,#f5576c,#764ba2); min-height:100vh; padding:40px; }
        .container { max-width:900px; margin:0 auto; }
        h1 { text-align:center; font-size:3.5em; background:linear-gradient(90deg,#f093fb,#f5576c); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:30px; }
        .card { background:white; border-radius:24px; padding:40px; margin:30px 0; box-shadow:0 20px 50px rgba(0,0,0,0.2); }
        input, textarea { width:100%; padding:18px; margin:12px 0; border-radius:16px; border:2px solid #eee; font-size:1.1em; }
        button { padding:18px 50px; background:linear-gradient(135deg,#48bb78,#38a169); color:white; border:none; border-radius:50px; font-size:1.3em; cursor:pointer; }
        button:hover { transform:translateY(-8px); box-shadow:0 20px 40px rgba(72,187,120,0.5); }
        .campanha { background:#f8f9ff; padding:25px; border-radius:16px; margin:20px 0; border-left:8px solid #667eea; }
        .autor { color:#667eea; font-weight:bold; }
        a.back { color:white; background:#764ba2; padding:12px 25px; border-radius:50px; text-decoration:none; }
    </style>
</head>
<body>
<div class="container">
    <h1>CAMPANHAS SOCIAIS</h1>
    <a href="/" class="back">← Voltar ao Início</a>

    <div th:if="${usuario}" class="card">
        <h2 style="color:#48bb78;">Criar Nova Campanha</h2>
        <form action="/nova-campanha" method="post">
            <input type="text" name="titulo" placeholder="Título da campanha" required>
            <textarea name="descricao" rows="6" placeholder="Descreva sua ideia incrível..." required></textarea>
            <button type="submit">PUBLICAR CAMPANHA</button>
        </form>
    </div>

    <div th:unless="${usuario}" class="card" style="background:#fff3cd;color:#856404;text-align:center;">
        <h2>Faça login para criar campanhas!</h2>
        <a href="/login" style="padding:15px 40px;background:#667eea;color:white;border-radius:50px;text-decoration:none;">Fazer Login</a>
    </div>

    <div class="card">
        <h2 style="color:#f093fb;">Todas as Campanhas</h2>
        <div th:each="c : ${campanhas}" class="campanha">
            <h3 th:text="${c.titulo}">Título</h3>
            <p th:text="${c.descricao}">Descrição aqui...</p>
            <p><span class="autor" th:text="${c.autor}"></span> • 
               <small th:text="${#dates.format(c.data, 'dd/MM/yyyy HH:mm')}"></small>
            </p>
        </div>
        <p th:if="${#lists.isEmpty(campanhas)}" style="text-align:center;color:#888;font-size:1.3em;">
            Nenhuma campanha criada ainda. Seja o primeiro!
        </p>
    </div>
</div>
</body>
</html>

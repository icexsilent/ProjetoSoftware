<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rede+Social</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div class="header"><div class="logo">Rede+Social</div></div>

    <div class="container">
        <div class="card">
            <div class="card-header">Olá, <span th:text="${usuario} ?: 'Visitante'">Visitante</span>!</div>
            <div class="card-body" th:if="${usuario}">
                <small><a href="/logout" style="color:#0095f6;">Sair da conta</a></small>
            </div>
            <div class="card-body" th:unless="${usuario}">
                <a href="/login" style="color:#0095f6; font-weight:600;">Entrar na conta →</a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Cadastrar Candidato</div>
            <div class="card-body">
                <form action="/cadastrar-candidato" method="post">
                    <input type="text" name="id" placeholder="ID único (ex: cand001)" required>
                    <input type="text" name="nome" placeholder="Nome completo" required>
                    <input type="email" name="email" placeholder="E-mail" required>
                    <input type="text" name="cpf" placeholder="CPF (apenas números)" required>
                    <button type="submit">Cadastrar Candidato</button>
                </form>
            </div>
        </div>

        <div th:each="cand : ${candidatos}" class="card">
            <div class="card-body">
                <h4 th:text="${cand.nome}">Nome</h4>
                <p>ID: <strong th:text="${cand.id}"></strong> • CPF: <span th:text="${cand.cpf}"></span></p>
                <small th:text="${cand.email}"></small>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Nova Doação</div>
            <div class="card-body">
                <form action="/nova-doacao" method="post">
                    <input type="text" name="doadorId" placeholder="Seu ID (ex: doa001)" required>
                    <input type="number" step="0.01" name="valor" placeholder="Valor em R$" required>
                    <input type="text" name="descricao" placeholder="Motivo da doação" required>
                    <button type="submit">Doar Agora</button>
                </form>
            </div>
        </div>

        <div th:each="doa : ${doacoes}" class="card">
            <div class="card-body">
                <p><strong>R$ <span th:text="${doa.valor}"></span></strong></p>
                <p th:text="${doa.descricao}"></p>
                <small>Doador: <strong th:text="${doa.doadorId}"></strong> • Confirmada</small>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="/" class="active"><i data-feather="home"></i>Início</a>
        <a href="/campanhas"><i data-feather="flag"></i>Campanhas</a>
        <a th:href="${usuario} ? '/perfil' : '/login'"><i data-feather="user"></i>Perfil</a>
    </div>

    <script>feather.replace()</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Campanhas - Rede Mais Social</title>
    <meta charset="UTF-8">
    <style> /* Mesmo CSS do dashboard.html para consistência */ </style>
</head>
<body>
    <div class="header">
        <h1>Campanhas e Eventos</h1>
        <p th:if="${usuario}">Bem-vindo, <span th:text="${usuario}"></span>!</p>
        <a href="/">Voltar</a>
    </div>

    <div class="feed">
        <div class="abas">
            <button onclick="showTab('ativas')">Campanhas Ativas</button>
            <button onclick="showTab('eventos')">Eventos</button>
        </div>

        <div id="ativas">
            <h2>Candidatos (Campanhas)</h2>
            <div th:each="cand : ${candidatos}" class="feed-item">
                <h4 th:text="${cand.nome}">Nome</h4>
                <p th:text="'Apoie: ' + ${cand.email}"></p>
                <button>Apoiar</button> <!-- Futuro: ação de apoio -->
            </div>
        </div>

        <div id="eventos" class="hidden">
            <h2>Doações (Eventos)</h2>
            <div th:each="doa : ${doacoes}" class="feed-item">
                <p th:text="'Evento: ' + ${doa.descricao} + ' | Valor: R$ ' + ${doa.valor}"></p>
                <button>Participar</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="/">Início</a>
        <a href="/campanhas">Campanhas</a>
        <a th:if="${usuario}" href="/perfil">Perfil</a>
    </div>

    <script>
        function showTab(tab) {
            document.getElementById('ativas').classList.toggle('hidden', tab !== 'ativas');
            document.getElementById('eventos').classList.toggle('hidden', tab !== 'eventos');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rede Mais Social</title>
    <style>
        body {font-family: Arial; background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 40px; text-align: center;}
        h1 {font-size: 3em; margin-bottom: 30px;}
        .card {background: rgba(255,255,255,0.15); padding: 30px; border-radius: 20px; margin: 20px auto; max-width: 800px; backdrop-filter: blur(10px);}
        input, textarea, button {width: 90%; padding: 15px; margin: 10px; border-radius: 10px; border: none; font-size: 1.1em;}
        button {background: #48bb78; color: white; font-weight: bold; cursor: pointer;}
        table {width: 100%; margin: 20px 0; color: white;}
        a {color: #f093fb; font-weight: bold; margin: 0 10px;}
        .btn {padding: 12px 25px; background: #f093fb; color: white; border-radius: 50px; text-decoration: none;}
    </style>
</head>
<body>
    <h1>REDE MAIS SOCIAL</h1>

    <div th:if="${usuario}">
        <p>Olá, <strong th:text="${usuario}"></strong> | 
        <a href="/perfil">Perfil</a> | 
        <a href="/campanhas" class="btn">Campanhas</a> | 
        <a href="/logout">Sair</a></p>
    </div>
    <div th:unless="${usuario}">
        <a href="/login" class="btn">Login</a>
        <a href="/cadastro" class="btn">Criar Conta</a>
        <a href="/campanhas" class="btn">Ver Campanhas</a>
    </div>

    <div class="card">
        <h2>Novo Voluntário</h2>
        <form action="/cadastrar-candidato" method="post">
            <input name="nome" placeholder="Nome completo" required>
            <input name="email" placeholder="E-mail">
            <input name="cpf" placeholder="CPF (opcional)">
            <button>Cadastrar</button>
        </form>
    </div>

    <div class="card">
        <h2>Fazer Doação</h2>
        <form action="/nova-doacao" method="post">
            <input name="doadorNome" th:placeholder="${usuario} ?: 'Seu nome (ou anônimo)'">
            <input name="valor" type="number" step="0.01" placeholder="Valor R$" required>
            <input name="descricao" placeholder="Descrição" required>
            <button>Doar</button>
        </form>
    </div>

    <h2>Voluntários</h2>
    <table>
        <tr th:each="c : ${candidatos}">
            <td th:text="${c.nome}"></td>
            <td th:text="${c.email}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(candidatos)}"><td colspan="2">Nenhum voluntário ainda</td></tr>
    </table>

    <h2>Doações</h2>
    <table>
        <tr th:each="d : ${doacoes}">
            <td th:text="${d.doadorId}"></td>
            <td th:text="'R$ ' + ${d.valor}"></td>
            <td th:text="${d.descricao}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(doacoes)}"><td colspan="3">Nenhuma doação ainda</td></tr>
    </table>

    <p><strong>Rede Mais Social © 2025 - Rodrigo & Vinícius</strong></p>
</body>
</html>

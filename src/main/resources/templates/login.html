<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Rede Mais Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c); background-size: 400% 400%; animation: g 12s ease infinite; height:100vh; display:flex; align-items:center; justify-content:center; margin:0; overflow:hidden; }
        @keyframes g { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .card { background:white; padding:60px 50px; border-radius:30px; width:420px; box-shadow:0 30px 80px rgba(0,0,0,0.4); text-align:center; animation:float 6s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-25px)} }
        h1 { font-size:3.5em; background:linear-gradient(90deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:20px; }
        input { width:100%; padding:18px; margin:15px 0; border-radius:16px; border:2px solid #eee; font-size:1.1em; }
        input:focus { border-color:#667eea; box-shadow:0 0 0 6px rgba(102,126,234,0.2); outline:none; }
        button { width:100%; padding:20px; background:linear-gradient(135deg,#667eea,#764ba2); color:white; border:none; border-radius:16px; font-size:1.4em; cursor:pointer; }
        button:hover { transform:translateY(-8px); box-shadow:0 20px 40px rgba(102,126,234,0.6); }
        .erro { color:#e53e3e; background:#ffe6e6; padding:15px; border-radius:12px; margin:15px 0; }
        .sucesso { color:#48bb78; background:#e6f9f0; padding:15px; border-radius:12px; margin:15px 0; }
    </style>
</head>
<body>
<div class="card">
    <h1>REDE MAIS SOCIAL</h1>
    <p style="color:#666;font-size:1.2em;">Bem-vindo de volta!</p>
    <form action="/login" method="post">
        <input type="text" name="login" placeholder="Login" required autofocus>
        <input type="password" name="senha" placeholder="Senha" required>
        <div th:if="${erro}" class="erro" th:text="${erro}"></div>
        <div th:if="${sucesso}" class="sucesso" th:text="${sucesso}"></div>
        <button type="submit">ENTRAR</button>
    </form>
    <p style="margin-top:30px;">Não tem conta? <a href="/cadastro" style="color:#667eea;font-weight:bold;">Criar agora</a></p>
    <p><a href="/" style="color:#888;">← Voltar ao início</a></p>
</div>

<script>
    if (new URLSearchParams(window.location.search).get('sucesso')) {
        confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
    }
</script>
</body>
</html>
